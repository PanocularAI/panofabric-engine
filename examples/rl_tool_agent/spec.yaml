# RL for a tool-calling agent whose loop is your own code: Qwen3.5-9B on one
# H100:8 island (trainer TP=4 + four generators), nothing synchronized.
#
# Submit with:
#   panofabric run submit spec.yaml --code models/rl_tool_agent
#
# model.hf_model makes the scheduler fetch Qwen3.5-9B's tokenizer AND
# safetensors into the island's assets dir; the preset starts from them.
name: rl-tool-agent
workload:
  kind: rl
  sync:
    # One island training by itself (rl_solo_*): no sync hub, no weights shipped
    # between processes. For several islands use `method: heloco` -- the same
    # preset name runs as rl_heloco_*.
    method: none
model:
  module: models.rl_tool_agent
  preset: rl_solo_tool_agent_qwen3_5_9b
  hf_model: Qwen/Qwen3.5-9B
training:
  steps: 100
metrics:
  log_freq: 10          # steps per window: the validation and logging cadence
fabric:
  islands:
    # No `role`: with no `role: generator` islands, this island generates for
    # itself -- the preset splits its GPUs between the trainer and vLLM.
    - count: 1
      resources:
        accelerators: "H100:8"   # split: trainer TP=4 + four TP=1 generators
        # Host RAM. Slurm's default is 4 GB per vCPU x 4 vCPUs per GPU = 128 GB
        # here, tight for four trainer ranks reading a 19 GB checkpoint. 
        memory: "256+"
        # cloud ("nebius", "aws/us-east-1") or enrolled backend ("ssh/<pool>",
        # "slurm/<cluster>[/<partition>]", "k8s/<ctx>"). `panofabric backend list`
        # prints the exact strings; omit the field to let PanoFabric pick.
        infra: "nebius"
